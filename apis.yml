name: KelAI
description: KelAI (Kelai) is an AI quant research platform for hedge funds and institutional
  investors that positions itself as an autonomous alpha engine. Its AI agents run the
  full systematic-research workflow — generating trading-signal ideas, writing and testing
  research code, analyzing market data, running backtests and validation, and monitoring
  live signal performance — consolidating what normally runs across siloed systems and
  inefficient workflows. Founded by Jeremie Cohen, a former WorldQuant portfolio manager
  and head of event-driven systematic strategies who also led machine learning teams at
  Millennium Management, KelAI is part of Y Combinator's Spring 2026 batch and is deployed
  with institutional investors. As an early-stage company it does not yet publish a public
  developer API, documentation, or SDKs.
